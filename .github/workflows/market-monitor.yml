name: market-monitor-refresh

# 云端定时刷新（无需本机开机）：
#   北京 10:00 / 11:00 / 13:30 / 14:30 / 14:55（工作日）
#   GitHub Actions Cron 使用 UTC：北京 = UTC+8
#   10:00 -> '0 2 * * 1-5'    11:00 -> '0 3 * * 1-5'
#   13:30 -> '30 5 * * 1-5'   14:30 -> '30 6 * * 1-5'
#   14:55 -> '55 6 * * 1-5'
on:
  schedule:
    - cron: '0 2 * * 1-5'
    - cron: '0 3 * * 1-5'
    - cron: '30 5 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '55 6 * * 1-5'
  workflow_dispatch: {}   # 支持手动触发调试

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run market monitor pipeline (public APIs)
        run: python ga_pipeline.py
        working-directory: .

      - name: Commit and push data.json
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json temperature_history.json icepoint_state.json
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
          else
            git commit -m "auto refresh $(date -u +'%Y-%m-%d %H:%M' UTC)"
            git push origin main
          fi
